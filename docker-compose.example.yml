version: '3.8'

services:
  anythingllm:
    image: mintplexlabs/anythingllm:master
    container_name: anythingllm
    ports:
      - "3001:3001"
    environment:
      - STORAGE_DIR=/app/storage
    volumes:
      - ./anythingllm_storage:/app/storage
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wood_backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - SUPABASE_DB_URL=postgresql+asyncpg://postgres.[your-project-id]:[password]@aws-1-ap-northeast-2.pooler.supabase.com:5432/postgres
      - CORS_ORIGINS=https://your-frontend.vercel.app,http://localhost:5173
      - GEMINI_API_KEY=your_gemini_api_key
      - GEMINI_MODEL=gemini-3.1-flash-lite
      - ANYTHINGLLM_URL=http://anythingllm:3001
      - ANYTHINGLLM_API_KEY=your_anythingllm_api_key
      - ANYTHINGLLM_WORKSPACE=product-molding
      - MCP_URL=https://tool.vfmgroup.vn/db-mcp/mcp
      - MCP_TOKEN=your_mcp_token
    depends_on:
      - anythingllm
    restart: always
